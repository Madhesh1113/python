<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python from Scratch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1E1B4B;
    --surface: #252148;
    --surface2: #2E2A5C;
    --gold: #FFD23F;
    --teal: #4FD1C5;
    --coral: #FF6B6B;
    --text: #F5F3FF;
    --text-dim: #B8B3E0;
    --border: #3A3570;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height:1.65;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4{ font-family:'Space Grotesk', sans-serif; }
  code, .mono { font-family:'JetBrains Mono', monospace; }

  /* Layout */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width: 280px;
    flex-shrink:0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 0 60px 0;
    position: sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar{ width:6px; }
  .sidebar::-webkit-scrollbar-thumb{ background: var(--border); border-radius:3px; }

  .brand{
    padding: 0 24px 20px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .brand-mark{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Space Grotesk'; font-weight:700; font-size:19px;
  }
  .brand-mark .dot{ color: var(--gold); }
  .brand-sub{ font-size:12.5px; color: var(--text-dim); margin-top:4px; }

  .nav-section{ margin-top: 6px; }
  .nav-section-title{
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 14px 24px 6px 24px;
    font-weight:600;
  }
  .nav-item{
    display:block;
    padding: 8px 24px 8px 24px;
    color: var(--text-dim);
    text-decoration:none;
    font-size: 14px;
    border-left: 3px solid transparent;
    cursor:pointer;
    transition: all .15s ease;
  }
  .nav-item:hover{ color: var(--text); background: rgba(255,255,255,0.03); }
  .nav-item.active{
    color: var(--gold);
    border-left-color: var(--gold);
    background: rgba(255,210,63,0.06);
    font-weight:500;
  }
  .nav-item .status{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--border); margin-right:8px; vertical-align:middle;
  }
  .nav-item.done .status{ background: var(--teal); }

  .main{ flex:1; min-width:0; padding: 48px 56px 120px 56px; max-width: 880px; }

  .topic{ display:none; animation: fadeIn .3s ease; }
  .topic.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    color: var(--teal);
    font-size: 13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin-bottom: 10px;
  }
  .topic h1{
    font-size: 34px;
    font-weight:700;
    margin-bottom: 18px;
    line-height:1.2;
  }
  .topic h3{
    font-size: 19px;
    margin: 32px 0 12px 0;
    color: var(--gold);
  }
  .topic p{
    color: var(--text);
    font-size: 15.5px;
    margin-bottom: 14px;
    max-width: 720px;
  }
  .topic ul, .topic ol{ margin: 0 0 16px 22px; }
  .topic li{ margin-bottom:8px; font-size:15.5px; }

  .callout{
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--teal);
    border-radius: 8px;
    padding: 16px 18px;
    margin: 18px 0;
    font-size: 14.5px;
    color: var(--text-dim);
  }
  .callout strong{ color: var(--teal); }

  .code-block{
    background: #14122E;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 16px 0;
    overflow-x:auto;
    font-family:'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height:1.7;
    position:relative;
  }
  .code-block .tag{
    position:absolute; top:0; right:0;
    background: var(--surface2);
    color: var(--text-dim);
    font-size:10.5px;
    padding:3px 10px;
    border-bottom-left-radius:8px;
    letter-spacing:0.05em;
    text-transform:uppercase;
  }
  .code-block .c-kw{ color: #FF6B9D; }
  .code-block .c-str{ color: var(--gold); }
  .code-block .c-num{ color: var(--teal); }
  .code-block .c-com{ color: var(--text-dim); font-style:italic; }
  .code-block .c-out{ color: #8AE68A; }

  /* Sticky-note diagram frame */
  .diagram-wrap{
    margin: 22px 0;
    display:flex;
    justify-content:center;
  }
  .sticky{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transform: rotate(-0.6deg);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    max-width: 100%;
  }
  .sticky.alt{ transform: rotate(0.6deg); }

  /* Quiz */
  .quiz{
    margin-top: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 26px;
  }
  .quiz-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom: 16px;
  }
  .quiz-head .icon{
    width:28px; height:28px; border-radius:8px;
    background: var(--gold); color: #1E1B4B;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px;
  }
  .quiz-head h4{ font-family:'Space Grotesk'; font-size:16px; }
  .quiz-q{ font-size:15px; margin-bottom:12px; font-weight:500; }
  .quiz-opts{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
  .quiz-opt{
    text-align:left;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 8px;
    cursor:pointer;
    font-size:14px;
    font-family:'Inter';
    transition: all .15s;
  }
  .quiz-opt:hover{ border-color: var(--teal); }
  .quiz-opt.correct{ background: rgba(79,209,197,0.15); border-color: var(--teal); color: var(--teal); }
  .quiz-opt.wrong{ background: rgba(255,107,107,0.15); border-color: var(--coral); color: var(--coral); }
  .quiz-feedback{ font-size: 13.5px; margin-top:10px; color: var(--text-dim); min-height:18px; }

  /* Prev/Next */
  .topic-nav{
    display:flex; justify-content:space-between; align-items:center;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .topic-nav button{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    cursor:pointer;
    font-family:'Inter'; font-size:14px; font-weight:500;
    transition: all .15s;
  }
  .topic-nav button:hover{ border-color: var(--gold); color: var(--gold); }
  .topic-nav button:disabled{ opacity:0.3; cursor:default; }
  .topic-nav button:disabled:hover{ border-color: var(--border); color: var(--text); }

  .progress-bar{
    position: fixed; top:0; left:280px; right:0; height:3px;
    background: rgba(255,255,255,0.05); z-index:10;
  }
  .progress-fill{ height:100%; background: var(--gold); transition: width .3s ease; }

  @media (max-width: 860px){
    .sidebar{ position:fixed; left:-280px; z-index:100; transition:left .2s; box-shadow: 8px 0 30px rgba(0,0,0,0.4); }
    .sidebar.open{ left:0; }
    .main{ padding: 70px 20px 100px 20px; max-width:100%; }
    .progress-bar{ left:0; }
    .menu-btn{
      position:fixed; top:14px; left:14px; z-index:101;
      background: var(--surface); border:1px solid var(--border);
      color: var(--gold); width:40px; height:40px; border-radius:8px;
      font-size:18px; cursor:pointer;
    }
  }
  .menu-btn{ display:none; }
  @media (max-width:860px){ .menu-btn{ display:block; } }
</style>
</head>
<body>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<button class="menu-btn" id="menuBtn">☰</button>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">🐍 Py<span class="dot">Basics</span></div>
      <div class="brand-sub">Python from scratch, plain English</div>
    </div>
    <div id="navContainer"></div>
  </nav>

  <main class="main">
    <div id="topicsContainer"></div>
  </main>
</div>

<script>
// ===== DATA: sections and topics =====
const SECTIONS = [
  {
    title: "1. Getting Started",
    topics: [
      {id:"what-is-python", label:"What is Python?"},
      {id:"how-python-runs", label:"How a program runs"},
      {id:"print", label:"print() — showing output"}
    ]
  },
  {
    title: "2. Storing Information",
    topics: [
      {id:"variables", label:"Variables"},
      {id:"data-types", label:"Data types"},
      {id:"math-ops", label:"Basic math operations"},
      {id:"fstrings", label:"f-strings"}
    ]
  },
  {
    title: "3. Text Handling",
    topics: [
      {id:"strings", label:"Strings in detail"},
      {id:"input", label:"input() — asking the user"}
    ]
  },
  {
    title: "4. Making Decisions",
    topics: [
      {id:"if-else", label:"if / else / elif"},
      {id:"comparisons", label:"Comparison operators"},
      {id:"logical-ops", label:"and / or / not"}
    ]
  },
  {
    title: "5. Repeating Things",
    topics: [
      {id:"for-loops", label:"for loops"},
      {id:"while-loops", label:"while loops"},
      {id:"break-continue", label:"break and continue"}
    ]
  },
  {
    title: "6. Grouping Data",
    topics: [
      {id:"lists", label:"Lists"},
      {id:"tuples", label:"Tuples"},
      {id:"dictionaries", label:"Dictionaries"},
      {id:"sets", label:"Sets"},
      {id:"comprehensions", label:"List & dict comprehensions"}
    ]
  },
  {
    title: "7. Reusable Code",
    topics: [
      {id:"functions", label:"Functions"},
      {id:"params-return", label:"Parameters and return values"},
      {id:"scope", label:"Scope"}
    ]
  },
  {
    title: "8. Organizing Bigger Programs",
    topics: [
      {id:"modules", label:"Modules and imports"},
      {id:"files", label:"Basic file handling"},
      {id:"datetime", label:"Dates and time"}
    ]
  },
  {
    title: "9. Handling Problems",
    topics: [
      {id:"errors", label:"Errors and exceptions"},
      {id:"try-except", label:"try / except"},
      {id:"debugging", label:"Reading errors & debugging"}
    ]
  },
  {
    title: "10. Intro to Objects",
    topics: [
      {id:"classes-intro", label:"What a class and object are"},
      {id:"classes-why", label:"Why classes are useful"}
    ]
  },
  {
    title: "11. Practice Projects",
    topics: [
      {id:"proj-calculator", label:"Simple Calculator"},
      {id:"proj-quiz", label:"Quiz Game"},
      {id:"proj-todo", label:"To-Do List App"}
    ]
  }
];

const COMING_SOON_SECTIONS = [];

let allTopicIds = [];
SECTIONS.forEach(s => s.topics.forEach(t => allTopicIds.push(t.id)));
let completed = new Set();
let currentIndex = 0;

// ===== Build sidebar =====
const navContainer = document.getElementById('navContainer');
SECTIONS.forEach(section => {
  const secDiv = document.createElement('div');
  secDiv.className = 'nav-section';
  const title = document.createElement('div');
  title.className = 'nav-section-title';
  title.textContent = section.title;
  secDiv.appendChild(title);
  section.topics.forEach(topic => {
    const a = document.createElement('a');
    a.className = 'nav-item';
    a.dataset.id = topic.id;
    a.innerHTML = `<span class="status"></span>${topic.label}`;
    a.onclick = () => goToTopic(topic.id);
    secDiv.appendChild(a);
  });
  navContainer.appendChild(secDiv);
});

// Coming soon sections (visual placeholder, disabled)
COMING_SOON_SECTIONS.forEach(title => {
  const secDiv = document.createElement('div');
  secDiv.className = 'nav-section';
  const t = document.createElement('div');
  t.className = 'nav-section-title';
  t.textContent = title;
  t.style.opacity = '0.35';
  secDiv.appendChild(t);
  const note = document.createElement('div');
  note.style.padding = '2px 24px 10px 24px';
  note.style.fontSize = '12.5px';
  note.style.color = 'var(--text-dim)';
  note.style.opacity = '0.5';
  note.textContent = 'Coming in the next update';
  secDiv.appendChild(note);
  navContainer.appendChild(secDiv);
});

function goToTopic(id){
  document.querySelectorAll('.topic').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('topic-' + id).classList.add('active');
  document.querySelector(`.nav-item[data-id="${id}"]`).classList.add('active');
  currentIndex = allTopicIds.indexOf(id);
  updateProgress();
  window.scrollTo(0,0);
  if(window.innerWidth <= 860){ document.getElementById('sidebar').classList.remove('open'); }
}

function markDone(id){
  completed.add(id);
  const navEl = document.querySelector(`.nav-item[data-id="${id}"]`);
  if(navEl) navEl.classList.add('done');
  updateProgress();
}

function updateProgress(){
  const pct = Math.round((completed.size / allTopicIds.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
}

function nextTopic(){
  if(currentIndex < allTopicIds.length - 1){
    goToTopic(allTopicIds[currentIndex+1]);
  }
}
function prevTopic(){
  if(currentIndex > 0){
    goToTopic(allTopicIds[currentIndex-1]);
  }
}

document.getElementById('menuBtn').onclick = () => {
  document.getElementById('sidebar').classList.toggle('open');
};

// ===== Quiz helper =====
function renderQuiz(container, q){
  const wrap = document.createElement('div');
  wrap.className = 'quiz';
  wrap.innerHTML = `
    <div class="quiz-head"><div class="icon">?</div><h4>Quick check</h4></div>
    <div class="quiz-q">${q.question}</div>
    <div class="quiz-opts"></div>
    <div class="quiz-feedback"></div>
  `;
  const optsDiv = wrap.querySelector('.quiz-opts');
  const feedback = wrap.querySelector('.quiz-feedback');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt;
    btn.onclick = () => {
      const buttons = optsDiv.querySelectorAll('.quiz-opt');
      buttons.forEach(b => b.disabled = true);
      if(i === q.correct){
        btn.classList.add('correct');
        feedback.textContent = "✓ " + q.explain;
        feedback.style.color = 'var(--teal)';
      } else {
        btn.classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        feedback.textContent = "✗ " + q.explain;
        feedback.style.color = 'var(--coral)';
      }
    };
    optsDiv.appendChild(btn);
  });
  container.appendChild(wrap);
}

function renderTopicNav(container, id){
  const idx = allTopicIds.indexOf(id);
  const navDiv = document.createElement('div');
  navDiv.className = 'topic-nav';
  navDiv.innerHTML = `
    <button id="prevBtn-${id}">← Previous</button>
    <button id="nextBtn-${id}">Next →</button>
  `;
  container.appendChild(navDiv);
  navDiv.querySelector(`#prevBtn-${id}`).onclick = prevTopic;
  navDiv.querySelector(`#nextBtn-${id}`).onclick = () => { markDone(id); nextTopic(); };
  if(idx === 0) navDiv.querySelector(`#prevBtn-${id}`).disabled = true;
  if(idx === allTopicIds.length - 1) navDiv.querySelector(`#nextBtn-${id}`).textContent = "Finish ✓";
}
</script>

<script src="topics-1.js"></script>
<script src="topics-2.js"></script>
<script src="topics-3.js"></script>
<script src="topics-4.js"></script>
<script src="topics-5.js"></script>
<script src="topics-6.js"></script>
<script src="topics-7.js"></script>
<script src="topics-8.js"></script>
<script src="topics-9.js"></script>
<script src="topics-10.js"></script>
<script src="topics-11.js"></script>
<script>
  // Activate first topic on load
  goToTopic(allTopicIds[0]);
</script>

</body>
</html>
